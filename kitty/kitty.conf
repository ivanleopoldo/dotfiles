
# ===============================
# Kitty Terminal Configuration
# VSCode Minimal Dark Theme Exact
# ===============================

# ===============================
# Window & Appearance
# ===============================
window_padding_width 24
window_padding_height 24
window_padding_balance yes
macos_titlebar_color background
tab_bar_edge top

background_opacity 0.95
background_blur 40

active_border_color #505050
inactive_border_color #3a3a3a
window_border_width 1

# ===============================
# Font
# ===============================
font_family monospace
bold_font auto
italic_font auto
bold_italic_font auto
font_size 13.0
adjust_line_height 0
adjust_column_width 0

# ===============================
# macOS Specific Options
# ===============================
macos_option_as_alt left
macos_traditional_fullscreen no
macos_quit_when_last_window_closed no

# ===============================
# Cursor
# ===============================
cursor_shape beam
cursor_blink_interval 0
cursor #d8d8d8
cursor_text_color #222222

# ===============================
# Selection
# ===============================
selection_foreground #d8d8d8
selection_background #505050
copy_on_select yes
clipboard_control write-clipboard read-clipboard

# ===============================
# Tab Bar
# ===============================
tab_bar_style powerline
tab_powerline_style slanted
tab_title_template "{index} - {title}"

active_tab_foreground #dddddd
active_tab_background #1a1a1a
inactive_tab_foreground #777777
inactive_tab_background #161616

# ===============================
# Scrollback & Performance
# ===============================
scrollback_lines 10000
wheel_scroll_multiplier 5.0
repaint_delay 10
input_delay 3
sync_to_monitor yes
allow_remote_control no
update_check_interval 0

# ===============================
# Foreground / Background
# ===============================
foreground #ffffff
background #222222

# ===============================
# ANSI Colors (Exact from VSCode JSON)
# ===============================
color0  #222222   # black / background
color8  #2E2E2E   # bright black / badges, gutter

color1  #e29090   # red / errors
color9  #e29090   # bright red

color2  #B5BD68   # green / added text
color10 #B5BD68   # bright green

color3  #f7df9b   # yellow / warnings
color11 #f7df9b   # bright yellow

color4  #81A2BE   # blue / info
color12 #81A2BE   # bright blue

color5  #B294BB   # magenta
color13 #B294BB   # bright magenta

color6  #8ABEB7   # cyan
color14 #8ABEB7   # bright cyan

color7  #ffffff   # white / foreground
color15 #ffffff   # bright white
