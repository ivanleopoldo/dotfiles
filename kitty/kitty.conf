# ==================================================
# Identity
# ==================================================

title 🍓 milk
confirm_os_window_close 0


# ==================================================
# Appearance
# ==================================================

background #121212
foreground #f2f4f8

# Window padding
window_padding_width 24
window_padding_height 24
window_padding_balance yes
macos_titlebar_color background
hide_window_decorations titlebar-only
tab_bar_edge bottom

background_opacity 0.80


# ==================================================
# Cursor
# ==================================================

cursor #ffffff
cursor_text_color #000000
cursor_shape beam
cursor_blink_interval 0


# ==================================================
# Selection
# ==================================================

selection_background #393939
selection_foreground #626262


# ==================================================
# Borders / Dividers
# ==================================================

active_border_color #383838
inactive_border_color #383838
window_border_width 1


# ==================================================
# Clipboard / Selection Behavior
# ==================================================

copy_on_select yes
clipboard_control write-clipboard read-clipboard


# ==================================================
# Font (safe defaults — adjust if desired)
# ==================================================

font_family monospace
bold_font auto
italic_font auto
bold_italic_font auto

font_size 13.0
adjust_line_height 0
adjust_column_width 0


# ==================================================
# Color Palette (Oxocarbon-inspired)
# ==================================================

color0  #161616
color1  #00dfdb
color2  #00b4ff
color3  #ff4297
color4  #00c15a
color5  #c693ff
color6  #ff74b8
color7  #f2f4f8

color8  #585858
color9  #00dfdb
color10 #00b4ff
color11 #ff4297
color12 #00c15a
color13 #c693ff
color14 #ff74b8
color15 #f2f4f8


# ==================================================
# macOS Behavior
# ==================================================

macos_option_as_alt left
macos_traditional_fullscreen no
macos_quit_when_last_window_closed no


# ==================================================
# Tabs (SAFE with AeroSpace)
# ==================================================

tab_bar_edge top
tab_bar_style powerline
tab_powerline_style slanted
tab_title_template "{index} - {title}"

active_tab_foreground   #f2f4f8
active_tab_background   #161616
inactive_tab_foreground #585858
inactive_tab_background #121212


# ==================================================
# Tab Keybindings
# ==================================================

map ctrl+t new_tab
map ctrl+shift+t new_tab_with_cwd

map ctrl+tab next_tab
map ctrl+shift+tab previous_tab

map ctrl+w close_tab

map ctrl+1 goto_tab 1
map ctrl+2 goto_tab 2
map ctrl+3 goto_tab 3
map ctrl+4 goto_tab 4


# ==================================================
# Splits (Kitty calls these "windows")
# ==================================================

# Create splits (matches your Ghostty binds)
map ctrl+shift+h launch --location=vsplit
map ctrl+shift+l launch --location=vsplit
map ctrl+shift+j launch --location=hsplit
map ctrl+shift+k launch --location=hsplit

# Navigate splits
map ctrl+h neighboring_window left
map ctrl+j neighboring_window down
map ctrl+k neighboring_window up
map ctrl+l neighboring_window right

# Close split
map ctrl+q close_window


# ==================================================
# Resize Splits (tmux-like)
# ==================================================

map ctrl+alt+h resize_window narrower 5
map ctrl+alt+l resize_window wider 5
map ctrl+alt+j resize_window taller 3
map ctrl+alt+k resize_window shorter 3


# ==================================================
# Focus & Layout Utilities
# ==================================================

map ctrl+enter toggle_layout stack
map ctrl+shift+enter toggle_layout splits


# ==================================================
# Scrolling
# ==================================================

scrollback_lines 10000
wheel_scroll_multiplier 5.0


# ==================================================
# Performance
# ==================================================

repaint_delay 10
input_delay 3
sync_to_monitor yes


# ==================================================
# Safety / Sanity
# ==================================================

allow_remote_control no
update_check_interval 0

